name: TVHeadend Greek - Docker GHCR

on:
  push:
    branches:
      - feature/greek-localization
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and publish TVHeadend Greek
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile.greek-full
          platforms: linux/amd64
          push: true
          build-args: |
            TVH_CUSTOM_VERSION=4.3-Greek-1.0
          tags: |
            ghcr.io/camthalion77/tvheadend-greek:4.3-greek-1.0
          labels: |
            org.opencontainers.image.title=TVHeadend Greek
            org.opencontainers.image.version=4.3-Greek-1.0
            org.opencontainers.image.source=https://github.com/Camthalion77/tvheadend
          cache-from: type=gha
          cache-to: type=gha,mode=max
